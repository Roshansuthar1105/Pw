# ============================================================
# PROD Profile
# ============================================================

# PostgreSQL - Production (use environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=HikariPool-Prod
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# DDL - never auto-alter schema in production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Logging - minimal in prod
logging.level.com.template.app=INFO
logging.level.root=WARN

# CORS - Production frontend origin
app.cors.allowed-origins=${FRONTEND_URL:https://yourdomain.com}
