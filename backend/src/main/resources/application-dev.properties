# ============================================================
# DEV Profile
# ============================================================

# PostgreSQL - Local Development DB
# ⚠️  UPDATE THESE to match YOUR local PostgreSQL credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/setupdb
spring.datasource.username=postgres
spring.datasource.password=roshan1234
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=HikariPool-Dev
spring.datasource.hikari.maximum-pool-size=5

# DDL auto - create-drop is fine for dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logging
logging.level.com.template.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

# CORS - Allow Angular dev server
app.cors.allowed-origins=http://localhost:4200
