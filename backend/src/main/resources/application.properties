# ============================================================
# Application - Base Configuration
# ============================================================
spring.application.name=angular-springboot-template

# Active profile (override per environment)
spring.profiles.active=dev

# Server
server.port=8080
server.servlet.context-path=/api
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application info (shown in /actuator/info)
info.app.name=${spring.application.name}
info.app.version=0.0.1-SNAPSHOT
info.app.java-version=21

# ============================================================
# Flyway - Database Migration
# ============================================================
# Migrations are stored in the project-root db/migration/ folder
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../db/migration,filesystem:db/migration,filesystem:./db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

