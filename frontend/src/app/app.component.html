<div class="app-layout">
  <!-- Navigation Header -->
  <header class="app-header">
    <div class="container header-container">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">{{ appTitle() }}</span>
      </div>

      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" id="nav-home">
          Home
        </a>
        <a routerLink="/items" routerLinkActive="active" class="nav-item" id="nav-items">
          Items Demo
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Routed Views -->
  <main class="app-main">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="container footer-container">
      <p>&copy; {{ currentYear() }} Fullstack Angular + Spring Boot Template</p>
      <div class="footer-links">
        <span class="footer-tag">Angular 21</span>
        <span class="footer-tag">Spring Boot 3.3</span>
      </div>
    </div>
  </footer>
</div>
